# Rebuilds the live site every night at 00:05 Lagos time, so finished events
# move to "Past events" and anniversary-style pages switch to recap mode
# even if nobody edits anything. Needs a repository secret BUILD_HOOK_URL
# (Cloudflare: Workers & Pages → your project → Settings → Builds → Deploy hooks).
name: Nightly rebuild
on:
  schedule:
    - cron: "5 23 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build hook
        run: |
          if [ -z "${{ secrets.BUILD_HOOK_URL }}" ]; then echo "BUILD_HOOK_URL not set yet"; exit 0; fi
          curl -fsS -X POST -d '{}' "${{ secrets.BUILD_HOOK_URL }}"
